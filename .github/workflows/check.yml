name: StoneCut checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: bash -n deploy.sh && node --check electron/main.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: stonecut-${{ github.sha }}
          path: dist
